name: ISO-Tests unit tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'profiles/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isotests-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check syntax and run harness tests
        run: |
          python3 -m py_compile scripts/iso_tests.py tests/test_iso_tests.py
          python3 -m unittest discover -s tests -v
